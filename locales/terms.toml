# The Term List (spec 0005): one controlled word per language for each naval-architecture term.
#
# A translator uses the listed term every time the English term appears in a message.
# Each language entry is [term, status, note]:
#   status "draft"         a first draft (by a person or a machine), not checked;
#   status "reviewed"      checked by a native speaker with marine knowledge (add "@handle" to the note);
#   status "needs-native"  no established term is known: the English term is kept, and a native
#                          speaker with marine knowledge should decide. Never invent a word.
# `glossary` names the GLOSSARY.md term where OVCD defines the word, if it does.
# Twi (ak) keeps English for nearly every technical term: few established Twi terms exist for them.

[draught]
en = "draught"
glossary = ""
es = ["calado", "draft", ""]
pt = ["calado", "draft", ""]
