# Calibration Bands (GLOSSARY: the accepted range around a Reference Vessel's published figure).
#
# A band is set per figure and per confidence level of the case (the `confidence` field of each
# case in cases.yaml), so every case with an observed figure has a band, and its basis is the
# figure plus the confidence. `pct` is the accepted error of the model against the published
# figure, in percent either way.
#
# Starting values, set by the maintainer (issue #119). For the first 12 cases the error is IN-SAMPLE: the
# fitted factors in factors.yaml (hold-type k, box-barge Cb) were fitted to the same cases, and the
# container factor rests on one case. For a case with a `held_out` marker (issue #3) the error is OUT
# OF SAMPLE: the case is never used in a fit. The bands say how far the model may sit from the
# published figure while it is in development; they are not a validation. A case outside its band is
# a WARNING only: the report marks it and CI prints a warning annotation. It never fails the build.
bands:
  lightship_t:
    label: Lightship
    pct: {high: 15.0, medium: 20.0, low: 30.0}
    basis: "lightship +-15 % at high confidence, +-20 % at medium, +-30 % at low (maintainer, issue #119); in-sample for fitted cases, out of sample for held-out cases"
  dwt_t:
    label: Deadweight at the stated draught
    pct: {high: 7.5, medium: 10.0, low: 15.0}
    basis: "deadweight +-7.5 % at high confidence, +-10 % at medium, +-15 % at low (maintainer, issue #119); in-sample for fitted cases, out of sample for held-out cases"
  bollard_pull_t:
    label: Bollard pull
    pct: {high: 10.0, medium: 15.0, low: 20.0}
    basis: "bollard pull +-10 % at high confidence, +-15 % at medium, +-20 % at low (spec 0007, an estimate the maintainer may change); the cases of propulsion_cases.yaml; in-sample for fitted cases, out of sample for held-out cases"
  stern_block_m:
    label: Stern block length
    pct: {high: 25.0, medium: 30.0, low: 35.0}
    basis: "stern block +-25 % at high confidence, +-30 % at medium, +-35 % at low (an estimate for issue #365: the length is measured from a drawing, so its own tolerance is 2 to 8 %, and the layout is a rule for the length of rooms the drawing shows in many layouts); the stern_block_case list of propulsion_cases.yaml; in-sample for the fitted ships"
  installed_power_kw:
    label: Installed power
    pct: {high: 15.0, medium: 20.0, low: 30.0}
    basis: "installed power +-15 % at high confidence, +-20 % at medium, +-30 % at low (spec 0007, an estimate the maintainer may change); the installed power cases of propulsion_cases.yaml; in-sample for fitted cases, out of sample for held-out cases"
