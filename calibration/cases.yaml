# Calibration cases: real (or published design) vessels whose inputs we run through the core
# and whose published figures we compare against. One row = one vessel/design at one condition.
# Every observed figure cites a source (see calibration/ga_sources notes and catalogue/raw/).
# kind:
#   dry_barge  — pushed dry-cargo barge. Checks lightship and/or deadweight at a stated draught.
#   motor_point — self-propelled design point with displacement, cargo and installed power.

# hold_type: box (vertical inner sides) | container. All cases below are pushed barges.
# exclude_from_fit: a reason, when the published figures cannot all describe one condition.
#
# Held-out cases (issue #3): a case with a truthy `held_out` (a one-line reason) is run and banded but
# NEVER used to fit k or Cb (fit_factors drops it). The 12 first cases are in-sample; every case added
# for issue #3 is held out, so its error is out of sample.
# Two batches are held out: the 62 cases from the research note carry `note_suggests`; the later ones from
# follow-up research (2026-10-16) carry `found_by` and no `note_suggests`.
# Fields only the held-out cases use:
#   hold_type: deck  a flat deck barge. The core has no deck model, so `run_as: box` says the case is
#                    run as a box barge (box k, box Cb): does the box model carry over to deck barges?
#   hold_type: pontoon  a flat-top pontoon barge (follow-up batch), run as box in its own summary group.
#   run_as           the hold type the core runs (deck or pontoon -> box).
#   water_density_t_m3  density for the predicted DWT: 1.025 for sea-going or saltwater figures.
#                    Omitted (1.000, fresh) for river figures.
#   published        the observed figures as the source prints them (units and wording kept).
#   found_by         set on the follow-up cases: they are not from the research note, so no note_suggests.
#   observed.dwt_t_draught_not_stated  a published DWT with no draught: shown in `published`, never banded.
#   note_suggests    what the research note suggested (fit | hold out | cross-check | exclude). Kept so
#                    it is not lost; it decides nothing.
#   cross_check_only a reason: shown in the report, never banded.
#   flags, note      conflicts and cautions, as the research recorded them.
#   observed.cargo_capacity_t   a published cargo capacity that is not a DWT: shown, never banded.
#   observed.tank_capacity_m3, observed.lng_capacity_m3   capacities: shown, never banded.
# A missing figure is absent (no key). Nothing is estimated, rounded or filled in.
# Web sources are listed in sources.yaml under `web_sources`; each case `source` starts with its id.
# `not_yet_runnable_cases` (at the end) are listed in the report with their figures and the reason;
# they are never run.
