# Tank-barge reference vessels (issue #335, spec 0006 section 7): published river, river-sea and sea
# tank barges and tankers that the tank-barge path of the calibration runs. They are in a file of their
# own, with the 41 `hold_type: tank` records of cases.yaml, because that file's counts and its in-sample
# and held-out batches are fixed (tests/test_calibration_held_out.py).
#
# These are the vessels of docs/research/crude-oil/03-design-practice.md section 3 that have full data
# (the research marks them with a tick) and are not yet in cases.yaml. The other four (ROB20, 004ROB05,
# ROB07 and 1635T) are in cases.yaml already. Every figure below was read on the source page itself, on
# 2026-10-22, and each source has its checksum in sources.yaml (`web_sources`, ids M15 to M25 and R1).
#
# Conventions are those of cases.yaml: every case is held out, a figure the source does not give is
# absent, `published` keeps the source text as printed. Fields that are new here:
#   self_propelled   true when the vessel has its own machinery. The tank-barge model is hull plus
#                    outfit; it has no engines, no accommodation and no fuel. A deadweight run on it is
#                    too high by about that weight, so such a case is shown and never banded.
#   not_banded       a reason the case has no band, when it has none: a self-propelled hull, or a cargo
#                    capacity that is not a deadweight.
#   water_density_t_m3  as in cases.yaml: 1.025 for a sea draught, else fresh water (left out).
# The draught is the one the page gives the deadweight for. A page that gives a river and a sea
# deadweight is run at the river draught (3.60 m), in fresh water, as the box-barge Cb of factors.yaml was
# fitted. Where a page gives the breadth overall and the breadth by the hull, the breadth overall is used,
# as in cases.yaml.
tank_barge:
