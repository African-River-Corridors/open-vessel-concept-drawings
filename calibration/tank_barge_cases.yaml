    hold_type: tank
    what: "Project ROB21, small-draught non-self-propelled river oil tanker"
    loa_m: 85.00
    beam_m: 17.20
    depth_m: 2.60
    draught_m: 1.80
    observed: {dwt_t: 1801, tank_capacity_m3: 3257}
    published: "deadweight in river at d = 1.40 / 1.60 / 1.80 / 2.0 / 2.15 / 2.35 m (about) 1235 / 1526 / 1801 / 2075 / 2280 / 2555 t; draught at DWL 1.80 m; 14 cargo tanks, 3257 m3 (when filling 98%)"
    source: "M15 — MEB project page, Project ROB21, accessed 2026-10-22"
    confidence: medium
    held_out: "tank-barge calibration (issue #335): never used to fit k"
    flags: "The deadweight is 'about'. The tank volume is at 98 % filling."
    note: "Run at the DWL draught of 1.80 m with its deadweight 1801 t."
