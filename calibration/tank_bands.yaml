# Calibration Bands for the Type C tank cases (issue #292): the same shape as bands.yaml. `pct` is the
# accepted error of the model against the published figure, in percent either way, per confidence of
# the case. These are STARTING values proposed with the first tank cases, in the shape of the barge
# bands; the maintainer sets them. Every tank case is held out, so every error is out of sample (but see
# `steel_in_sample` in tank_cases.yaml). A case outside its band is a WARNING only: the report marks
# it and `python -m vessel_designer.calibration --check` prints an annotation. It never fails the build.
bands:
  tank_volume_m3:
    label: Gross tank volume
    pct: {high: 3.0, medium: 5.0, low: 10.0}
    basis: "tank volume +-3 % at high confidence, +-5 % at medium, +-10 % at low (proposed with issue #292); out of sample"
  tank_wall_mm:
    label: Cylinder wall thickness
    pct: {high: 10.0, medium: 15.0, low: 25.0}
    basis: "wall thickness +-10 % at high confidence, +-15 % at medium, +-25 % at low (proposed with issue #292); the model is the full chain of the engine (allowance, rounded up to 0.5 mm, IGC minimum)"
  tank_steel_t:
    label: Tank steel weight
    pct: {high: 15.0, medium: 20.0, low: 30.0}
    basis: "tank steel +-15 % at high confidence, +-20 % at medium, +-30 % at low (proposed with issue #292); shell plates at the published thickness times the structure factor of the Defaults Profile"
