# Plate-level hull steel benchmarks (issue #751, spec 0013 "Calibration" and D16).
# Hand-written. Read by no code yet. Pattern: calibration/hull_steel_cases.yaml (one entry per source, with its URL,
# retrieval date and the SHA-256 of the bytes served, the source text as printed in `published`, a `confidence`
# and `flags`). Research note: docs/research/plate-steel-benchmarks.md (the search line and why each candidate failed).
#
# Concept and preliminary design only (ADR 0011). These are published scantlings of other vessels. They are a
# benchmark to compare the plate model with, never a target to tune to (D16).
#
# Rules for this file:
# - Every value is in the cited text, which was read on the retrieval date. Page, table or section is given.
# - Units are as printed. Where a value is converted, the printed value is kept and the conversion is marked `derived`.
# - A value the source does not give is left out. Nothing is estimated or filled in.
# - Licence: values are extracted as facts with attribution. No figure or long text is copied.
#
# Ranked by fit (plate-level detail, barge type, size near 140 x 29 m, completeness). Rank 1 is the best.

