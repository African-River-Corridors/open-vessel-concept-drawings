# Propulsion calibration cases (issue #351, spec 0007 "Calibration and evaluation"): tugs and pushers
# with a published bollard pull, run through the Propulsor model only (no hull), with the published
# figure they are compared against. The vessels are those of docs/research/stern-and-tugs.md sec. 10.
#
# Every figure is as the source prints it. A figure the source does not give is absent; nothing is
# estimated or filled in. Each case names the file it was read from in the rule-source library
# (`source_file`, relative to stern-tug/, outside the repo, ADR 0001), the SHA-256 of that download as
# stern-tug/SOURCES-vessels.md lists it, the URL and the date it was retrieved, and keeps the source
# text in `published`.
#
# The run:
#   run_as_type      the engine's Propulsor type. `type_basis` says why, where the source does not name
#                    a duct or a nozzle.
#   count            the number of units; `count_basis` where the source names the units without a count.
#   diameter_m       the propeller diameter; `diameter_basis` is `propeller` (printed as the propeller
#                    diameter) or `nozzle` (only the nozzle size is printed; run as the propeller).
#   power_per_unit_kw  the published power of one unit (a total over the count where the source gives
#                    only the total; hp at 0.7457 kW). `power_basis` is `engine` (brake power) or
#                    `motor` (an electric motor at the shaft).
#   drive            `shaft` (a shaft line, 0.99) or `azimuth` (an azimuth or L-drive, 0.95), the shaft
#                    efficiency of spec 0007 "Power and transmission". Engine power also passes the
#                    diesel-mechanical gearbox (0.97, spec 0007). P_D = power x gearbox x shaft.
#   water_density_kg_m3  1,025 for a seagoing tug, 1,000 for a river pusher.
# observed:
#   bollard_pull_t   the published bollard pull in tonnes (short tons at 0.90718 t; kN over the spec's
#                    g of 9.81). The direction is the one printed; a reversed stern drive pulls astern.
#
# In-sample cases fit the bollard pull factor kappa_b of their type (factors.yaml, `bollard_pull_factor`);
# a case with `held_out` (a one-line reason) is run and banded, never used in the fit. `accepted_miss`
# maps a figure to the reason its band miss is accepted: the report and the warning still show it.
