# Stern-block cases (issue #365): built ships and published standard designs with the length of the stern
# block (aft end of the hull to the forward bulkhead of the last machinery space below the main deck) and
# the aft peak, MEASURED from the general arrangement on the maker's or designer's sheet. Every length is
# DERIVED, not printed: the scale is the stated LOA over the drawn hull ends (frame spacing as a check
# where the sheet shows frames), and `tol_m` is the reading tolerance. The sheets are in a built-ship
# reference library (`source_file` is relative to it, with its SHA-256), outside the repo (ADR 0001); only the derived lengths and the citation are given here (the
# sheets are copyrighted, and no image is reproduced).
#
# The run (tools/stern_block_calibration.py): a self-propelled Design of the stated LOA, beam and depth
# with the stated propulsors and installed power, through the machinery layout of spec 0007 (#352); the
# modelled stern block is the end of the last machinery zone below deck.
#   run_as_type     shaft_nozzle for a shaft drive (the layout only needs shaft or not); azimuth_ducted
#                   for every other drive (the drive room is then the azimuth room of the stern block)
#   power_source    diesel_mechanical, or diesel_electric where the source says so
#   propeller_diameter_m  printed where `diameter_basis` is `source`; otherwise an estimate (0.65 x the
#                   draught). It sets only the shaft run (2 x D) of a shaft drive.
#   depth_m         printed, or the draught + 1.0 m where `depth_basis` says so (it enters only the
#                   warning that an engine fits under the deck)
# `fit: false` keeps a ship out of the fit (the reason is in `excluded`); it is still run and shown.
