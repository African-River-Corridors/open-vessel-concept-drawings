[project]
name = "open-vessel-designer"
version = "0.3.0"
description = "Concept design of inland and coastal cargo vessels: GA, characteristics, BOQ, cost — calibrated on real vessels."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "African River Corridors Limited" }]
readme = "README.md"
dependencies = ["pyyaml>=6"]

[project.urls]
Repository = "https://github.com/African-River-Corridors/open-vessel-designer"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-xdist>=3.6", "numpy>=1.26", "jsonschema>=4.18"]

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

# maturin builds crates/ovd-py (PyO3, abi3 for Python 3.12+) into ovd/_native, next to
# the thin Python layer in src/, which calls it for every calculation (ovd/_bridge.py).
# data/barge_cost_rates.example.yaml is a copy of examples/ (a test keeps the two equal); it sits
# inside src/ so it ships in the wheel and core.barge_cost finds it with importlib.resources.
[tool.maturin]
manifest-path = "crates/ovd-py/Cargo.toml"
module-name = "ovd._native"
python-source = "src"
features = ["pyo3/extension-module"]
include = ["src/ovd/data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `slow`: left out of the PR gate, run nightly (issue #481, docs/agents/slow-tests.md).
markers = ["slow: left out of the PR gate and run nightly; listed in docs/agents/slow-tests.md"]
