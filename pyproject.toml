[project]
name = "vessel-designer"
version = "0.2.3"
description = "Concept design of inland and coastal cargo vessels: GA, characteristics, BOQ, cost — calibrated on real vessels."
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "African River Corridors Limited" }]
readme = "README.md"
dependencies = ["pyyaml>=6"]

[project.urls]
Repository = "https://github.com/African-River-Corridors/open-vessel-concept-drawings"

[project.optional-dependencies]
dev = ["pytest>=8", "numpy>=1.26", "jsonschema>=4.18"]

[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

# maturin builds crates/ovcd-py (PyO3, abi3 for Python 3.12+) into vessel_designer/_native, next to
# the thin Python layer in src/, which calls it for every calculation (vessel_designer/_bridge.py).
# data/barge_cost_rates.example.yaml is a copy of examples/ (a test keeps the two equal); it sits
# inside src/ so it ships in the wheel and core.barge_cost finds it with importlib.resources.
[tool.maturin]
manifest-path = "crates/ovcd-py/Cargo.toml"
module-name = "vessel_designer._native"
python-source = "src"
features = ["pyo3/extension-module"]
include = ["src/vessel_designer/data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
