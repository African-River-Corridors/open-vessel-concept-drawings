name: App build

# Builds the desktop app installers: a Windows NSIS `-setup.exe` and macOS `.dmg` files (Apple
# silicon and Intel). The installers are NOT signed (no signing secrets are used).
#
# A release is made only on purpose (issue #173). `tools/release_plan.py` decides, in `verify`:
#   - The version number is bumped: a merge to `main` that changes `version` in pyproject.toml
#     publishes a numbered PRE-RELEASE `v<version>`, tagged at that commit, with the notes of that
#     version from CHANGELOG.md. A `v*` tag pushed by hand does the same.
#   - A test-release tag is pushed: `test-<anything>` publishes a PRE-RELEASE named after the tag,
#     with the notes of the `Unreleased` section. Use it to try a build without a version bump; the
#     commit need not be on `main`.
#   - Any other merge to `main` builds and publishes nothing. A manual start (Actions tab, "Run
#     workflow") builds the installers as workflow artifacts and publishes nothing.
#
# Nothing is published until `verify` passes: `test` and `release-guard` succeeded on the commit,
# and, for a numbered release, the commit is on `main`. Publishing also waits for `gate`, the whole
# release gate (release.yml: wheels, binaries and pytest on each system). A release made with
# GITHUB_TOKEN does not start other workflows, so the gate is called from here.
#
# The ordinary CI jobs only compile the app (fast). Bundling happens only here.

on:
  push:
    branches: ["main"]
    paths: ["pyproject.toml"] # only a merge that may bump the version; the plan checks that it did
    tags: ["v*", "test-*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      checks: read
    outputs:
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
      kind: ${{ steps.plan.outputs.kind }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the plan reads pyproject.toml before and after the push, and the tags
      - name: Plan the release
        id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 tools/release_plan.py
      - name: The commit is on main
        if: steps.plan.outputs.on_main == 'true'
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "the commit $GITHUB_SHA is not on origin/main"; exit 1; }
      - name: test and release-guard succeeded on the commit
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A check run can appear more than once (branch, pull request, tag). One success is enough.
          # Wait while a check is still running or has not appeared; fail if every run of it failed.
          deadline=$((SECONDS + 1800))
          while :; do
            runs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
              --jq '.check_runs[] | {name, status, conclusion}' | jq -s '.')
            pending=0
            for name in test release-guard; do
              ok=$(jq --arg n "$name" '[.[] | select(.name == $n and .conclusion == "success")] | length' <<<"$runs")
              open=$(jq --arg n "$name" '[.[] | select(.name == $n and .status != "completed")] | length' <<<"$runs")
              seen=$(jq --arg n "$name" '[.[] | select(.name == $n)] | length' <<<"$runs")
              if [ "$ok" -gt 0 ]; then echo "$name: success"; continue; fi
              if [ "$open" -gt 0 ] || [ "$seen" -eq 0 ]; then echo "$name: waiting"; pending=1; continue; fi
              echo "$name did not succeed on $GITHUB_SHA"; exit 1
            done
            [ "$pending" -eq 0 ] && exit 0
            [ "$SECONDS" -lt "$deadline" ] || { echo "timed out waiting for test and release-guard"; exit 1; }
            sleep 30
          done

  gate:
    # The release gate (wheels, binaries, pytest on each system), before anything is published.
    if: needs.verify.outputs.publish == 'true'
    needs: verify
    uses: ./.github/workflows/release.yml

  build:
    needs: verify
    if: needs.verify.outputs.build == 'true'
    name: installer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: nsis
            glob: target/release/bundle/nsis/*-setup.exe
          - name: macos-apple-silicon
            os: macos-latest
            bundles: dmg
            glob: target/release/bundle/dmg/*.dmg
          - name: macos-intel
            os: macos-15-intel
            bundles: dmg
            glob: target/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@v4
      - name: A version tag must match the package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Front end dependencies
        working-directory: app
        run: npm ci
      # The official Tauri action, pinned to a commit (action-v0.6.2). It builds the bundle; the
      # release is made by the `release` job below, so that this job needs no write permission.
      - name: Build the installer
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        with:
          projectPath: app
          args: --bundles ${{ matrix.bundles }}
      - name: Verify the app signature in the DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg=$(ls target/release/bundle/dmg/*.dmg)
          mount=$(hdiutil attach -nobrowse -readonly "$dmg" | awk -F'\t' '/\/Volumes\// { print $NF }' | tail -n 1)
          app=$(find "$mount" -maxdepth 1 -name '*.app' | head -n 1)
          codesign -dv --verbose=2 "$app"
          if ! codesign --verify --deep --strict --verbose=2 "$app"; then
            hdiutil detach "$mount"
            exit 1
          fi
          hdiutil detach "$mount"
      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: ovd-${{ matrix.name }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  release:
    if: needs.verify.outputs.publish == 'true'
    needs: [build, verify, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: ovd-*
          merge-multiple: true
      - name: Checksums
        working-directory: installers
        run: |
          ls -l
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          KIND: ${{ needs.verify.outputs.kind }}
        run: |
          if [ "$KIND" = numbered ]; then
            # the section of this version; a version bump must add one
            awk -v v="${TAG#v}" '
              /^## /{ if (on) exit; if (index($0, "## " v) == 1) { on = 1; next } }
              on { print }
            ' CHANGELOG.md > notes.md
            test -s notes.md || { echo "CHANGELOG.md has no section for ${TAG#v}"; exit 1; }
          else
            # a test release: what is not yet in a numbered release
            {
              echo "A test build from commit ${GITHUB_SHA:0:7}. It is not a numbered release. The installer file names carry the last numbered version."
              echo
              echo "## Unreleased changes"
              awk '/^## /{ if (on) exit; if ($0 == "## Unreleased") { on = 1; next } } on { print }' CHANGELOG.md
            } > notes.md
          fi
          {
            echo
            echo "These installers are not signed. Windows SmartScreen and macOS show a warning on first start; the README says what to click."
            echo "OVD is a concept design tool. Its results are not verified. There is no warranty."
          } >> notes.md
          cat notes.md
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
          KIND: ${{ needs.verify.outputs.kind }}
        run: |
          if [ "$KIND" = test ]; then title="Test build $TAG (${GITHUB_SHA:0:7})"; else title="$TAG"; fi
          # A pushed tag exists already; a version bump on main creates its tag at this commit.
          if [ "$GITHUB_REF_TYPE" = tag ]; then where=(--verify-tag); else where=(--target "$GITHUB_SHA"); fi
          gh release create "$TAG" installers/* \
            "${where[@]}" \
            --prerelease \
            --title "$title" \
            --notes-file notes.md
