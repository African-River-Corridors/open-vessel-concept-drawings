name: App build

# Builds the desktop app installers: a Windows NSIS `-setup.exe` and macOS `.dmg` files (Apple
# silicon and Intel). The installers are NOT signed (no signing secrets are used).
#
#   - A manual start (Actions tab, "Run workflow") builds the installers and keeps them as workflow
#     artifacts. It publishes nothing.
#   - A pushed tag `v*` builds them and then publishes a GitHub PRE-RELEASE named after the tag, with
#     the installers, a SHA-256 checksum file and the notes of that version from CHANGELOG.md.
#   - A push to `main` (every merge) builds them and replaces the one rolling pre-release `latest`,
#     pointed at that commit, with the notes of the `Unreleased` section (issue #169). A newer push
#     cancels an older build still running, so `latest` is always the newest `main`. A tag is never
#     cancelled.
#
# Nothing is built or published for a tag or a push to main until `verify` passes: the commit is on
# `main`, and the CI jobs `test` and `release-guard` succeeded on it. Publishing also waits for `gate`, which runs
# the whole release gate (release.yml: wheels, binaries and pytest on each system). A release made with
# GITHUB_TOKEN does not start other workflows, so the gate is called from here, not left to the
# `release: published` trigger.
#
# The ordinary CI jobs only compile the app (fast). Bundling happens only here.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: app-build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    # Runs for a manual start too, and passes there (its steps are for pushes only), so `build` can
    # always list it in `needs` without `always()`.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      - name: The commit is on main
        if: github.event_name == 'push'
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "the tagged commit $GITHUB_SHA is not on origin/main"; exit 1; }
      - name: test and release-guard succeeded on the commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A check run can appear more than once (branch, pull request, tag). One success is enough.
          # Wait while a check is still running or has not appeared; fail if every run of it failed.
          deadline=$((SECONDS + 1800))
          while :; do
            runs=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
              --jq '.check_runs[] | {name, status, conclusion}' | jq -s '.')
            pending=0
            for name in test release-guard; do
              ok=$(jq --arg n "$name" '[.[] | select(.name == $n and .conclusion == "success")] | length' <<<"$runs")
              open=$(jq --arg n "$name" '[.[] | select(.name == $n and .status != "completed")] | length' <<<"$runs")
              seen=$(jq --arg n "$name" '[.[] | select(.name == $n)] | length' <<<"$runs")
              if [ "$ok" -gt 0 ]; then echo "$name: success"; continue; fi
              if [ "$open" -gt 0 ] || [ "$seen" -eq 0 ]; then echo "$name: waiting"; pending=1; continue; fi
              echo "$name did not succeed on $GITHUB_SHA"; exit 1
            done
            [ "$pending" -eq 0 ] && exit 0
            [ "$SECONDS" -lt "$deadline" ] || { echo "timed out waiting for test and release-guard"; exit 1; }
            sleep 30
          done

  gate:
    # The release gate (wheels, binaries, pytest on each system), before anything is published.
    if: github.event_name == 'push'
    needs: verify
    uses: ./.github/workflows/release.yml

  build:
    needs: verify
    name: installer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            bundles: nsis
            glob: target/release/bundle/nsis/*-setup.exe
          - name: macos-apple-silicon
            os: macos-latest
            bundles: dmg
            glob: target/release/bundle/dmg/*.dmg
          - name: macos-intel
            os: macos-15-intel
            bundles: dmg
            glob: target/release/bundle/dmg/*.dmg
    steps:
      - uses: actions/checkout@v4
      - name: A release tag must match the package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Front end dependencies
        working-directory: app
        run: npm ci
      # The official Tauri action, pinned to a commit (action-v0.6.2). It builds the bundle; the
      # release is made by the `release` job below, so that this job needs no write permission.
      - name: Build the installer
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        with:
          projectPath: app
          args: --bundles ${{ matrix.bundles }}
      - name: Verify the app signature in the DMG
        if: runner.os == 'macOS'
        shell: bash
        run: |
          dmg=$(ls target/release/bundle/dmg/*.dmg)
          mount=$(hdiutil attach -nobrowse -readonly "$dmg" | awk -F'\t' '/\/Volumes\// { print $NF }' | tail -n 1)
          app=$(find "$mount" -maxdepth 1 -name '*.app' | head -n 1)
          codesign -dv --verbose=2 "$app"
          if ! codesign --verify --deep --strict --verbose=2 "$app"; then
            hdiutil detach "$mount"
            exit 1
          fi
          hdiutil detach "$mount"
      - name: Keep the installer
        uses: actions/upload-artifact@v4
        with:
          name: ovcd-${{ matrix.name }}
          path: ${{ matrix.glob }}
          if-no-files-found: error

  release:
    # Only for a pushed tag. A push to main publishes `latest` instead (below); a manual start stops
    # after `build`.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, verify, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: ovcd-*
          merge-multiple: true
      - name: Checksums
        working-directory: installers
        run: |
          ls -l
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            /^## /{ if (on) exit; if (index($0, "## " v) == 1) { on = 1; next } }
            on { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }
          {
            echo
            echo "These installers are not signed. Windows SmartScreen and macOS show a warning on first start; the README says what to click."
            echo "OVCD is a concept design tool. Its results are not verified. There is no warranty."
          } >> notes.md
          cat notes.md
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installers/* \
            --prerelease \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag

  latest:
    # Only for a push to main: replace the one rolling pre-release `latest` with this commit's build.
    if: github.ref == 'refs/heads/main'
    needs: [build, verify, gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: ovcd-*
          merge-multiple: true
      - name: Checksums
        working-directory: installers
        run: |
          ls -l
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Notes from the Unreleased section of CHANGELOG.md
        run: |
          short="${GITHUB_SHA:0:7}"
          awk '
            /^## /{ if (on) exit; if ($0 == "## Unreleased") { on = 1; next } }
            on { print }
          ' CHANGELOG.md > unreleased.md
          {
            echo "The newest build of \`main\`, from commit ${short}. It is rebuilt after every merge and is not a numbered release. The installer file names carry the last numbered version."
            echo
            echo "## Changes since the last numbered release"
            if grep -q '[^[:space:]]' unreleased.md; then cat unreleased.md; else echo; echo "None listed."; fi
            echo
            echo "These installers are not signed. Windows SmartScreen and macOS show a warning on first start; the README says what to click."
            echo "OVCD is a concept design tool. Its results are not verified. There is no warranty."
          } > notes.md
          cat notes.md
      - name: Replace the latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest installers/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --latest=false \
            --title "Latest build (main, ${GITHUB_SHA:0:7})" \
            --notes-file notes.md
