name: Website

# Builds the website and docs (website/build.py), checks the links, and on main deploys to
# GitHub Pages. The public URL is https://www.africanrivercorridors.com/ovd: the ARC site proxies
# /ovd to this Pages site (website/README.md).

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "*.md"
      - ".github/workflows/website.yml"
      - "app/**"
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tools/build_web.sh"
  # A pull request builds the site only when the site or the docs change (issue #565). A push to main
  # (above) still builds and deploys on any change that can alter it.
  pull_request:
    paths:
      - "website/**"
      - "docs/**"
      - "*.md"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the pinned docs tools
        run: python -m pip install -r website/requirements.txt
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
      - name: Install the pinned Rust toolchain (rust-toolchain.toml, with the wasm32 target)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: The pinned wasm-bindgen version
        id: wb
        run: echo "version=$(sed -n 's/^wasm-bindgen = "=\([0-9.]*\)".*/\1/p' crates/ovd-web/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: wasm-bindgen CLI (cached)
        id: cli
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ steps.wb.outputs.version }}-${{ runner.os }}
      - name: Install wasm-bindgen CLI
        if: steps.cli.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "${{ steps.wb.outputs.version }}" --locked
      - name: Build the web package (wasm)
        run: bash tools/build_web.sh
      - name: Build the web app
        working-directory: app
        run: npm ci && npm run build:web
      - name: Build the site and docs (mkdocs --strict fails on a broken docs link), with the web app
        run: python website/build.py --app-dist app/dist-web
      - name: Check every internal link in the built site
        run: python website/check_links.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: website/_site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://www.africanrivercorridors.com/ovd
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
