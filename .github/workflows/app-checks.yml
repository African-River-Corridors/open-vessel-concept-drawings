name: App and web checks

# Checks that no pull request has to wait for (issues #565, #716). None of them is a required check; `test`,
# `release-guard` and `drawing-crosscheck` stay in ci.yml. app-e2e and web-app run on release and weekly,
# not on every PR: they are in app-gate.yml, which release.yml calls and which this workflow calls every
# Monday (07:47 UTC) and on request. `web-parity` is in web-parity.yml, a release gate as well.
#
#   app-linux, app-windows  Every day (07:17 UTC) and on request (workflow_dispatch). Never on a pull
#                         request or a push to main.
#
# A failed scheduled run opens an issue (the last job), so a regression found later is not lost.

on:
  schedule:
    - cron: "17 7 * * *" # every day, 07:17 UTC: app-linux and app-windows
    - cron: "47 7 * * 1" # every Monday, 07:47 UTC: web-app and app-e2e
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-checks-${{ github.run_id }}
  cancel-in-progress: false

jobs:

  # web-app and app-e2e (app-gate.yml): every Monday and on request, not on the daily run.
  app-gate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '47 7 * * 1' }}
    uses: ./.github/workflows/app-gate.yml

  # The desktop app (spec 0002). Kept out of the fast gate: it needs Node and the Tauri system
  # libraries, and the workspace's default members must build without them.
  app-linux:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Front end (type check and build)
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: App crate (clippy, tests)
        run: |
          cargo clippy -p ovd-app --all-targets -- -D warnings
          cargo test -p ovd-app

  # The Windows build only has to compile: there is no installer yet.
  app-windows:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Front end (type check and build)
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Compile the app crate
        run: cargo build -p ovd-app

  # A failed scheduled run opens one issue, or adds a comment to the one that is open.
  daily-failure:
    if: failure() && github.event_name == 'schedule'
    needs: [app-gate, app-linux, app-windows]
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Daily app and web checks failed"
          body="The daily run of \`app-checks.yml\` failed: $RUN"
          n=$(gh issue list --repo "${{ github.repository }}" --state open --search "\"$title\" in:title" --json number -q '.[0].number')
          if [ -n "$n" ]; then
            gh issue comment "$n" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body" --label needs-triage
          fi
