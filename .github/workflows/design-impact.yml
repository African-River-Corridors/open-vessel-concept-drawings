name: Design impact

# Tells every pull request whether designs moved (spec 0001, ticket 28). The fast gate (tools/gates.sh,
# step "design impact") runs the same check and fails only when a change is missing from CHANGELOG.md.
# A design change needs no sign-off.
#
# This workflow only MEASURES. It runs the pull request's own code, from this repository or from a
# fork, so it has a read-only token and no secrets. It keeps the report as an artifact. The workflow
# `Design impact publish` (design-impact-publish.yml) puts the report in the pull request body and
# sets the `design-change` label. That is how a fork's pull request gets them too (ticket 132).

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install pyyaml
      - name: Run the fixed designs on main and on this branch
        run: python tools/design_impact.py report
      - name: Keep the report for the publisher
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: echo "$PR_NUMBER" > target/design-impact/pr.txt
      - uses: actions/upload-artifact@v4
        with:
          name: design-impact
          path: |
            target/design-impact/report.md
            target/design-impact/summary.json
            target/design-impact/pr.txt
          if-no-files-found: error
          retention-days: 7
