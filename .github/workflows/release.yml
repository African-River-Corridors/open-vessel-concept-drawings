name: Release

# The release gate. It runs when a GitHub release is published, when a maintainer starts it by hand,
# and as a called workflow from app-build.yml, which runs it before it publishes any release (a release
# made with GITHUB_TOKEN does not start this workflow by itself).
# There is no nightly run. It builds and tests; it publishes NOTHING (no PyPI, no upload to a release).
# Wheels and binaries are kept as workflow artifacts for the maintainer to inspect.
#
# Order: `gate` (the CI jobs `test` and `release-guard`) -> `web-parity`, `wasm-hashes`, `wheels` and `binaries`. Both build jobs
# list `gate` in `needs`, so a failing `test` or `release-guard` stops the run before any build step.

on:
  release:
    types: [published]
  workflow_dispatch:
  workflow_call: # app-build.yml runs this gate before it publishes a pushed tag

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  # WebAssembly parity (issue #245): the wasm Design session gives the native results hash for every
  # fixture. Release gate only (it left the pull request path, see web-parity.yml).
  web-parity:
    needs: gate
    uses: ./.github/workflows/web-parity.yml

  # A calibration case outside its band blocks a release unless the CHANGELOG entry of that release explains
  # it (issue #431, docs/agents/build-process.md). A failure here fails `gate` of app-build.yml.
  calibration-bands:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install the package
        run: python -m pip install .
      - name: Every case outside its band is explained in the CHANGELOG entry of this release
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          python -m vessel_designer.calibration --release-check "$v"

  wheels:
    needs: gate
    name: wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Check a release tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }
      - name: pip install . builds and installs from source
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/src-venv"
          PY="$RUNNER_TEMP/src-venv/bin/python"; [ -x "$PY" ] || PY="$RUNNER_TEMP/src-venv/Scripts/python.exe"
          "$PY" -m pip install .
          "$PY" -c "import vessel_designer, vessel_designer._native as n; print('native', n.version())"
      - name: Build the wheel
        shell: bash
        run: |
          python -m pip install "maturin>=1.7,<2"
          maturin build --release --out dist
          ls dist
      - name: Install the wheel with no compiler, then run pytest on it
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          PY="$RUNNER_TEMP/wheel-venv/bin/python"; [ -x "$PY" ] || PY="$RUNNER_TEMP/wheel-venv/Scripts/python.exe"
          # Dependencies come from PyPI as binaries. The wheel itself comes from dist/ only.
          # --only-binary :all: forbids any source build, so this step cannot need Rust.
          "$PY" -m pip install --only-binary :all: pyyaml pytest numpy
          "$PY" -m pip install --only-binary :all: --no-index --no-deps --find-links dist vessel-designer
          "$PY" -m pip check
          # Test from a scratch copy so the checkout's src/ cannot shadow the installed wheel.
          # Tests that read the repo itself (workflows, tools, src/, calibration) run in `test`;
          # a test that scans a file list asserts the list is not empty, so it cannot pass here.
          # A test run here may read only the folders copied below; tests/test_workflows_release.py
          # checks that in `test`, so a new test that needs tools/ fails there, not at release (#211).
          mkdir "$RUNNER_TEMP/wheel-check"
          cp -r tests tools examples calibration catalogue evaluation "$RUNNER_TEMP/wheel-check/"
          # The evaluation harness reads the built-in Rule Set files from the checkout.
          mkdir -p "$RUNNER_TEMP/wheel-check/crates/ovcd-format"
          cp -r crates/ovcd-format/rules "$RUNNER_TEMP/wheel-check/crates/ovcd-format/"
          cd "$RUNNER_TEMP/wheel-check"
          "$PY" -c "import vessel_designer as v; print(v.__file__); assert 'site-packages' in v.__file__"
          "$PY" -m pytest -q tests \
            --ignore=tests/test_packaging.py --ignore=tests/test_housekeeping.py \
            --ignore=tests/test_release_guard.py --ignore-glob='tests/test_gates*.py' \
            --ignore=tests/test_pystr_tables.py --ignore=tests/test_vdesign_edge_sweep.py \
            --ignore-glob='tests/test_design_impact*.py' --ignore-glob='tests/test_workflows*.py' \
            --ignore=tests/test_changelog_fragments.py \
            --ignore=tests/test_test_labels.py --ignore-glob='tests/test_gen_*.py' \
            --ignore=tests/test_website_app_dist.py --ignore=tests/test_rule_set_schema.py \
            --ignore=tests/test_export_capytaine.py \
            --deselect=tests/test_api_small_changes.py::test_the_core_modules_no_longer_claim_to_run_in_pyodide \
            --deselect=tests/test_public_api.py::test_the_names_that_are_not_kept_are_only_standard_library_and_numpy_helpers \
            --deselect=tests/test_public_api.py::test_every_name_removed_on_purpose_is_in_the_changelog \
            --deselect=tests/test_calibration_runs.py::test_the_ci_runs_the_check_without_letting_a_band_miss_fail_the_build \
            --deselect=tests/test_i18n_check.py::test_the_text_library_is_whole_and_the_check_is_fast
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  # Platform-identical maths, WebAssembly (issue #168): the same CLI, built for `wasm32-wasip1` and run
  # under wasmtime, must give the results hash that each fixture Design stores. Release gate only.
  # wasmtime is built from the crates.io release, exact version, locked, and cached by version.
  wasm-hashes:
    needs: gate
    name: fixture hashes on WebAssembly (wasmtime)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Add the WebAssembly System Interface target
        run: rustup target add wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
      - name: wasmtime (cached)
        id: wasmtime
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasmtime
          key: wasmtime-49.0.3-${{ runner.os }}
      - name: Install wasmtime 49.0.3
        if: steps.wasmtime.outputs.cache-hit != 'true'
        run: cargo install wasmtime-cli --version 49.0.3 --locked
      - name: Build ovcd for wasm32-wasip1
        run: cargo build --release --locked -p ovcd-cli --target wasm32-wasip1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fixture results hashes match under wasmtime
        run: python tools/check_fixture_hashes.py --wasmtime ~/.cargo/bin/wasmtime target/wasm32-wasip1/release/ovcd.wasm

  binaries:
    needs: gate
    name: ovcd binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build ovcd
        run: cargo build --release --locked -p ovcd-cli
      - name: Smoke test
        shell: bash
        run: target/release/ovcd --version
      # A version release ships its Rule Set versions, so each must be in RELEASED.json and never
      # change after (spec 0004, #273). A test-release tag does not release them.
      - name: Every built-in Rule Set version is in RELEASED.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: target/release/ovcd rules --release-check
      # Platform-identical maths (spec 0001): the release binary must give the results hash that each
      # fixture Design stores. `cargo test` checks this on Linux only; this checks it on Windows and on
      # Intel and Apple-silicon macOS. Release gate only, not the pull request gate.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fixture results hashes match on this system
        shell: bash
        run: python tools/check_fixture_hashes.py target/release/ovcd
      - uses: actions/upload-artifact@v4
        with:
          name: ovcd-${{ matrix.os }}
          path: |
            target/release/ovcd
            target/release/ovcd.exe
          if-no-files-found: error
