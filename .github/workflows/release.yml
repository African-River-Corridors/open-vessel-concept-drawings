name: Release

# The release gate. It runs when a GitHub release is published and when a maintainer starts it by hand.
# There is no nightly run. It builds and tests; it publishes NOTHING (no PyPI, no upload to a release).
# Wheels and binaries are kept as workflow artifacts for the maintainer to inspect.
#
# Order: `gate` (the CI jobs `test` and `release-guard`) -> `wheels` and `binaries`. Both build jobs
# list `gate` in `needs`, so a failing `test` or `release-guard` stops the run before any build step.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/ci.yml

  wheels:
    needs: gate
    name: wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Check a release tag matches the package version
        if: github.event_name == 'release'
        shell: bash
        run: |
          v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }
      - name: pip install . builds and installs from source
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/src-venv"
          PY="$RUNNER_TEMP/src-venv/bin/python"; [ -x "$PY" ] || PY="$RUNNER_TEMP/src-venv/Scripts/python.exe"
          "$PY" -m pip install .
          "$PY" -c "import vessel_designer, vessel_designer._native as n; print('native', n.version())"
      - name: Build the wheel
        shell: bash
        run: |
          python -m pip install "maturin>=1.7,<2"
          maturin build --release --out dist
          ls dist
      - name: Install the wheel with no compiler, then run pytest on it
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-venv"
          PY="$RUNNER_TEMP/wheel-venv/bin/python"; [ -x "$PY" ] || PY="$RUNNER_TEMP/wheel-venv/Scripts/python.exe"
          # Dependencies come from PyPI as binaries. The wheel itself comes from dist/ only.
          # --only-binary :all: forbids any source build, so this step cannot need Rust.
          "$PY" -m pip install --only-binary :all: pyyaml pytest
          "$PY" -m pip install --only-binary :all: --no-index --no-deps --find-links dist vessel-designer
          "$PY" -m pip check
          # Test from a scratch copy so the checkout's src/ cannot shadow the installed wheel.
          # Tests that read the repo itself (workflows, tools, src/, parity, calibration) run in `test`;
          # a test that scans a file list asserts the list is not empty, so it cannot pass here.
          mkdir "$RUNNER_TEMP/wheel-check"
          cp -r tests examples calibration catalogue "$RUNNER_TEMP/wheel-check/"
          cd "$RUNNER_TEMP/wheel-check"
          "$PY" -c "import vessel_designer as v; print(v.__file__); assert 'site-packages' in v.__file__"
          "$PY" -m pytest -q tests \
            --ignore=tests/test_packaging.py --ignore=tests/test_housekeeping.py \
            --ignore=tests/test_release_guard.py --ignore=tests/test_gates_fail_closed.py \
            --ignore=tests/test_parity_driver.py --ignore=tests/test_frozen_reference.py \
            --ignore=tests/test_parity_cases.py \
            --ignore=tests/test_calibration_runs.py \
            --ignore=tests/test_parity_through_python.py --ignore=tests/test_test_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}
          path: dist/*.whl

  binaries:
    needs: gate
    name: ovcd binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build ovcd
        run: cargo build --release --locked -p ovcd-cli
      - name: Smoke test
        shell: bash
        run: target/release/ovcd --version
      - uses: actions/upload-artifact@v4
        with:
          name: ovcd-${{ matrix.os }}
          path: |
            target/release/ovcd
            target/release/ovcd.exe
          if-no-files-found: error
