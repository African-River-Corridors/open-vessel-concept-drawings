name: Design impact publish

# Puts the report of the `gate-impact` job of the `CI` workflow into the pull request body and sets or
# removes the `design-change` label. It runs when the CI run has finished, whether or not it passed: the
# report matters most when the gate failed because a table is missing (issue #571). It works for pull requests from forks, which have no write token in the
# `pull_request` event (ticket 132).
#
# Why this is safe (the usual `workflow_run` rules):
#   - It never checks out the pull request's code. `actions/checkout` has no `ref`, so it gets the
#     default branch, and the only code that runs is tools/design_impact.py from that branch.
#   - The artifact is data from an untrusted run. `publish-artifact` accepts exactly three plain files
#     of limited size (report.md, summary.json, pr.txt), checks their shape, removes the block markers,
#     control characters and @mentions, and publishes only to the pull request named in pr.txt when that
#     pull request is open and its head is the commit (and repository) this run was made for.
#   - Nothing from the artifact or the event is put into a shell command line: values go through `env`.
#   - It does not use `pull_request_target`.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      contains(fromJSON('["success", "failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4          # the default branch, never the pull request
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - uses: actions/download-artifact@v4
        id: report
        continue-on-error: true      # a run that stopped before the gate-impact job has no report
        with:
          name: design-impact
          path: ${{ runner.temp }}/design-impact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Publish the report and the label
        if: steps.report.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_DIR: ${{ runner.temp }}/design-impact
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
        run: |
          python tools/design_impact.py publish-artifact "$ARTIFACT_DIR" \
            --head-sha "$HEAD_SHA" --head-repo "$HEAD_REPO"
