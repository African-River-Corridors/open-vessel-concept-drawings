name: CI

on:
  # A push to a PR branch runs as `pull_request` only (issue #480). The tags are app-build.yml's: it
  # publishes a tag only when `test` and `release-guard` succeeded on its commit, and a `test-*` tag
  # may be on a commit that no other run checks.
  push:
    branches: ["main"]
    tags: ["v*", "test-*"]
  pull_request:
  # The merge queue (issue #560): the required checks run on the merge group's commit as well. The
  # group's design-impact check looks for well-formed changelog fragments, not one equal table.
  merge_group:
  workflow_dispatch:
  workflow_call: # the release workflow runs these same two jobs as its gate

permissions:
  contents: read

# A new push to a PR cancels the PR's older run. Any other run has a group of its own (the run id), so
# a run on `main` or a tag is never cancelled and never waits. Called from release.yml, `github.workflow`
# and `github.run_id` are the caller's, so the group never matches a run of this workflow by itself.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # Fast gate (spec 0001): one fail-closed script, tools/gates.sh. It is split across parallel jobs
  # (issue #561) with GATES_STEPS and GATES_PARTITION, and the job named `test` at the end is the
  # required check: it passes only when every part passed. The Rust tests run in four partitions; the
  # tests the `pr` profile leaves out run in nightly.yml (docs/agents/slow-tests.md).
  gate-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gate-env
        with:
          cache-key: gate-lint
      - name: Lint, Rule Set gate and WebAssembly build
        env:
          GATES_STEPS: lint,rules
        run: bash tools/gates.sh

  gate-rust:
    name: gate-rust (${{ matrix.part }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/gate-env
        with:
          cache-key: gate-rust
      - name: Rust tests, partition ${{ matrix.part }} of 4
        env:
          GATES_STEPS: rust
          GATES_PARTITION: ${{ matrix.part }}/4
        run: bash tools/gates.sh
      - name: Upload the nextest times (JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nextest-junit-${{ matrix.part }}
          path: target/nextest/pr/junit.xml
          if-no-files-found: ignore

  gate-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the design-impact check diffs against the merge base
      - uses: ./.github/actions/gate-env
        with:
          cache-key: gate-impact
      # The answers of a commit for the case set are always the same, so the newest saved ones are
      # restored and the base commit's answers are not worked out again when they are there
      # (tools/design_impact.py, issue #561). A run saves its own answers under its commit.
      - name: Restore the saved design-impact answers
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/design-impact-cache
          key: design-impact-${{ github.sha }}
          restore-keys: design-impact-
      - name: Design impact
        env:
          GATES_STEPS: impact
          DESIGN_IMPACT_CACHE: ${{ runner.temp }}/design-impact-cache
        run: bash tools/gates.sh
      - name: Save the design-impact answers
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/design-impact-cache
          key: design-impact-${{ github.sha }}
      # The report of the check above is the pull request's report: the `Design impact publish` workflow
      # puts it in the pull request body and sets the label, so the 224 cases run once (issue #571).
      # It also works for a fork's pull request: this job has a read-only token and no secrets.
      - name: Keep the report for the publisher
        if: always() && github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p target/design-impact
          echo "$PR_NUMBER" > target/design-impact/pr.txt
      - name: Upload the report
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: design-impact
          path: |
            target/design-impact/report.md
            target/design-impact/summary.json
            target/design-impact/pr.txt
          if-no-files-found: ignore
          retention-days: 7

  # pytest runs in four shards (issue #716). tools/pytest_shard.py gives each test to one shard by its
  # node id, so each collected test is in exactly one shard, and `test` below needs all four to pass.
  # tools/check_pytest_shards.py proves the split on a machine; it is not a CI step, so the gate does
  # not depend on artifact storage. The checks that run once (Calibration Bands, evaluation harness,
  # mutants) run in shard 1.
  gate-python:
    name: gate-python (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the mutants check diffs against the base branch
      - uses: ./.github/actions/gate-env
        with:
          cache-key: gate-python
      - name: pytest, shard ${{ matrix.shard }} of 4
        env:
          GATES_STEPS: pytest
          PYTHONPATH: tools
          PYTEST_ADDOPTS: -p pytest_shard
          PYTEST_SHARD: ${{ matrix.shard }}/4
        run: bash tools/gates.sh
      # Calibration Bands (issue #119): one warning annotation per case outside its band. A band miss
      # never fails the build; a crash does. It takes about a second.
      - name: Calibration against the Calibration Bands (warning only)
        if: matrix.shard == 1
        run: python -m ovd.calibration --check
      # Evaluation harness (issue #184): known designs with known verdicts per rule, run against the
      # engine. A FALSE PASS (the engine passes a criterion a case expects to fail) fails the build; a
      # false fail and a coverage gap are warning annotations, as the Calibration Bands are. A stale
      # evaluation/results.md also fails. It takes a few seconds.
      - name: Evaluation harness (a false pass fails the build)
        if: matrix.shard == 1
        run: python evaluation/run.py --check
      # The boundary mutants are generated (issue #184) and take about 3 minutes to generate again.
      # They change only with evaluation/, so a run that changes nothing there skips the check: a PR
      # is compared with its base branch, a push to main with the commit before it. A tag, a manual
      # run and the nightly run do it every time (issue #481, docs/agents/slow-tests.md).
      - name: The mutants file is what the generator writes (when evaluation/ changes)
        if: matrix.shard == 1
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          if [ "$EVENT" = merge_group ] && git cat-file -e "$GROUP_BASE^{commit}" 2>/dev/null \
               && git diff --quiet "$GROUP_BASE" HEAD -- evaluation/; then
            echo "No change under evaluation/ in this merge group: the check runs nightly."
          elif [ "$EVENT" = pull_request ] && git diff --quiet "origin/$BASE...HEAD" -- evaluation/; then
            echo "No change under evaluation/: the check runs nightly."
          elif [ "$EVENT" = push ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
               && git diff --quiet "$BEFORE" HEAD -- evaluation/; then
            echo "No change under evaluation/ in this push: the check runs nightly."
          else
            python evaluation/oracle/mutants.py --check
          fi

  # The required check. It is named `test`, as branch protection and release.yml expect. It passes only
  # when every part of the gate passed; a skipped, cancelled or missing part fails it.
  test:
    if: always()
    needs: [gate-lint, gate-rust, gate-impact, gate-python]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part of the gate passed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["RESULTS"])
          expected = {"gate-lint", "gate-rust", "gate-impact", "gate-python"}
          if set(needs) != expected:
              sys.exit(f"the parts of the gate are {sorted(needs)}, not {sorted(expected)}")
          bad = {n: v["result"] for n, v in needs.items() if v["result"] != "success"}
          if bad:
              sys.exit(f"the gate failed: {bad}")
          PY

  # The drawing crate against the Python implementation of the same standard (spec 0003): the views
  # of every fixture Design give equal normalised content in both. The Python tool is installed at
  # the commit that the pinned otd crate's standard/PIN.json pins (tools/otd.py), so a suite update
  # moves both together.
  drawing-crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build ovd
        run: cargo build -p ovd-cli
      - name: Install the Python implementation of the standard at the pinned commit
        run: |
          pin=$(python tools/otd.py pin)
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/${pin}"
      - name: Rust and Python give equal normalised content for every fixture view
        run: python tools/draw_crosscheck.py
      # The DXF files are read by readers that are not the crate: the standard's own test reader (group
      # codes, no ezdxf) and ezdxf with its audit. The reader lives in the standard's repository.
      - name: Read the DXF files back with the standard's reader and ezdxf
        run: |
          IFS=@ read -r repo commit < <(python tools/otd.py pin)
          git init -q "$RUNNER_TEMP/tdfa"
          git -C "$RUNNER_TEMP/tdfa" fetch -q --depth 1 "https://github.com/${repo}" "${commit}"
          git -C "$RUNNER_TEMP/tdfa" checkout -q FETCH_HEAD
          python tools/dxf_crosscheck.py --tdfa-src "$RUNNER_TEMP/tdfa"

  # The Khronos glTF validator on the .glb of every fixture (issue #460, spec 0008 "Phase 2: exports").
  gltf-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build ovd
        run: cargo build -p ovd-cli
      - name: Install the validator (pinned)
        run: npm install --no-save --no-package-lock gltf-validator@2.0.0-dev.3.10
      - name: Every fixture's .glb has no validator error
        run: node tools/gltf_validate.mjs target/debug/ovd

  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Embargoed terms and local paths (tree)
        run: python tools/release_guard.py
      - name: Embargoed terms and local paths (history)
        run: python tools/release_guard.py --history
      - name: Secrets (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose
