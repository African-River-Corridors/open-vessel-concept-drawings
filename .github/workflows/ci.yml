name: CI

on:
  # A push to a PR branch runs as `pull_request` only (issue #480). The tags are app-build.yml's: it
  # publishes a tag only when `test` and `release-guard` succeeded on its commit, and a `test-*` tag
  # may be on a commit that no other run checks.
  push:
    branches: ["main"]
    tags: ["v*", "test-*"]
  pull_request:
  workflow_dispatch:
  workflow_call: # the release workflow runs these same two jobs as its gate

permissions:
  contents: read

# A new push to a PR cancels the PR's older run. Any other run has a group of its own (the run id), so
# a run on `main` or a tag is never cancelled and never waits. Called from release.yml, `github.workflow`
# and `github.run_id` are the caller's, so the group never matches a run of this workflow by itself.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Fast gate (spec 0001): one fail-closed script, tools/gates.sh. Target under 5 minutes. It runs
  # the `pr` profile; the tests it leaves out run in nightly.yml (docs/agents/slow-tests.md).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the design-impact check diffs against the merge base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest (pinned)
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.100
      - name: Install the Python package (maturin builds the extension, so Rust comes first)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Fast gate
        run: bash tools/gates.sh
      # Calibration Bands (issue #119): one warning annotation per case outside its band. A band miss
      # never fails the build; a crash does. It takes about a second, so it stays in this job.
      - name: Calibration against the Calibration Bands (warning only)
        run: python -m vessel_designer.calibration --check
      # Evaluation harness (issue #184): known designs with known verdicts per rule, run against the
      # engine. A FALSE PASS (the engine passes a criterion a case expects to fail) fails the build; a
      # false fail and a coverage gap are warning annotations, as the Calibration Bands are. A stale
      # evaluation/results.md also fails. It takes a few seconds.
      - name: Evaluation harness (a false pass fails the build)
        run: python evaluation/run.py --check
      # The boundary mutants are generated (issue #184) and take about 3 minutes to generate again.
      # They change only with evaluation/, so a PR that changes nothing there skips the check; every
      # other run, and the nightly run, does it (issue #481, docs/agents/slow-tests.md).
      - name: The mutants file is what the generator writes (when evaluation/ changes)
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ] && git diff --quiet "origin/$BASE...HEAD" -- evaluation/; then
            echo "No change under evaluation/: the check runs nightly."
          else
            python evaluation/oracle/mutants.py --check
          fi

  # The web build (issue #245): the wasm Design session gives the same results hash as native
  # `ovcd run --json` for every fixture. The wasm-bindgen CLI is the version the crate pins.
  web-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: The pinned wasm-bindgen version
        id: wb
        run: echo "version=$(sed -n 's/^wasm-bindgen = "=\([0-9.]*\)".*/\1/p' crates/ovcd-web/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: wasm-bindgen CLI (cached)
        id: cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ steps.wb.outputs.version }}-${{ runner.os }}
      - name: Install wasm-bindgen CLI
        if: steps.cli.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "${{ steps.wb.outputs.version }}" --locked
      - name: Build the web package
        run: bash tools/build_web.sh
      - name: Build ovcd
        run: cargo build -p ovcd-cli
      - name: Results-hash parity, wasm against native
        run: node tools/web_parity.mjs

  # The web app (issue #246): the web build of the front end over the wasm Design session, in
  # headless Chrome. The wasm-bindgen CLI is the version the ovcd-web crate pins.
  web-app:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: The pinned wasm-bindgen version
        id: wb
        run: echo "version=$(sed -n 's/^wasm-bindgen = "=\([0-9.]*\)".*/\1/p' crates/ovcd-web/Cargo.toml)" >> "$GITHUB_OUTPUT"
      - name: wasm-bindgen CLI (cached)
        id: cli
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ steps.wb.outputs.version }}-${{ runner.os }}
      - name: Install wasm-bindgen CLI
        if: steps.cli.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version "${{ steps.wb.outputs.version }}" --locked
      - name: Build the web package
        run: bash tools/build_web.sh
      - name: Build ovcd
        run: cargo build -p ovcd-cli
      - name: Front end (type check, desktop build, web build)
        working-directory: app
        run: |
          npm ci
          npm run build
          npm run build:web
      - name: Web smoke test (headless Chrome)
        working-directory: app
        env:
          # The smoke test saves each view in each language, light and dark, here (spec 0005).
          OVCD_WEB_SHOTS: ${{ runner.temp }}/web-screenshots
        run: bash e2e/run-web.sh
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-screenshots
          path: ${{ runner.temp }}/web-screenshots
          if-no-files-found: warn

  # The drawing crate against the Python implementation of the same standard (spec 0003): the views
  # of every fixture Design give equal normalised content in both. The Python tool is installed at
  # the commit that the pinned otd crate's standard/PIN.json pins (tools/otd.py), so a suite update
  # moves both together.
  drawing-crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build ovcd
        run: cargo build -p ovcd-cli
      - name: Install the Python implementation of the standard at the pinned commit
        run: |
          pin=$(python tools/otd.py pin)
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/${pin}"
      - name: Rust and Python give equal normalised content for every fixture view
        run: python tools/draw_crosscheck.py
      # The DXF files are read by readers that are not the crate: the standard's own test reader (group
      # codes, no ezdxf) and ezdxf with its audit. The reader lives in the standard's repository.
      - name: Read the DXF files back with the standard's reader and ezdxf
        run: |
          IFS=@ read -r repo commit < <(python tools/otd.py pin)
          git init -q "$RUNNER_TEMP/tdfa"
          git -C "$RUNNER_TEMP/tdfa" fetch -q --depth 1 "https://github.com/${repo}" "${commit}"
          git -C "$RUNNER_TEMP/tdfa" checkout -q FETCH_HEAD
          python tools/dxf_crosscheck.py --tdfa-src "$RUNNER_TEMP/tdfa"

  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Embargoed terms and local paths (tree)
        run: python tools/release_guard.py
      - name: Embargoed terms and local paths (history)
        run: python tools/release_guard.py --history
      - name: Secrets (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose

  # The desktop app (spec 0002). Kept out of the fast gate: it needs Node and the Tauri system
  # libraries, and the workspace's default members must build without them.
  app-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Front end (type check and build)
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: App crate (clippy, tests)
        run: |
          cargo clippy -p ovcd-app --all-targets -- -D warnings
          cargo test -p ovcd-app

  # The Windows build only has to compile: there is no installer yet.
  app-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Front end (type check and build)
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Compile the app crate
        run: cargo build -p ovcd-app

  # End-to-end smoke tests (spec 0002): the built debug app, driven by Tauri's WebDriver on Linux.
  # Its own job, so the fast gate keeps its time budget.
  app-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system libraries, WebDriver and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb
      - name: tauri-driver (cached)
        id: driver
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-2.1.0-${{ runner.os }}
      - name: Install tauri-driver
        if: steps.driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Build the debug app
        working-directory: app
        run: |
          npm ci
          npx tauri build --debug --no-bundle
      - name: Smoke tests
        working-directory: app
        env:
          # The smoke tests save a screenshot of each view here, for review.
          OVCD_E2E_SHOTS: ${{ runner.temp }}/app-screenshots
        run: xvfb-run -a bash e2e/run.sh
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshots
          path: ${{ runner.temp }}/app-screenshots
          if-no-files-found: warn
