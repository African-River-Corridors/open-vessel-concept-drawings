name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call: # the release workflow runs these same two jobs as its gate

permissions:
  contents: read

jobs:
  # Fast gate (spec 0001): one fail-closed script, tools/gates.sh. Target under 5 minutes.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the design-impact check diffs against the merge base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install the Python package (maturin builds the extension, so Rust comes first)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Fast gate
        run: bash tools/gates.sh

  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Embargoed terms and local paths (tree)
        run: python tools/release_guard.py
      - name: Embargoed terms and local paths (history)
        run: python tools/release_guard.py --history
      - name: Secrets (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose
