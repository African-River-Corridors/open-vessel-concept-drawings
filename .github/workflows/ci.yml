name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call: # the release workflow runs these same two jobs as its gate

permissions:
  contents: read

jobs:
  # Fast gate (spec 0001): one fail-closed script, tools/gates.sh. Target under 5 minutes.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the design-impact check diffs against the merge base
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install the Python package (maturin builds the extension, so Rust comes first)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
      - name: Fast gate
        run: bash tools/gates.sh
      # Calibration Bands (issue #119): one warning annotation per case outside its band. A band miss
      # never fails the build; a crash does. It takes about a second, so it stays in this job.
      - name: Calibration against the Calibration Bands (warning only)
        run: python -m vessel_designer.calibration --check
      # Evaluation harness (issue #184): known designs with known verdicts per rule, run against the
      # engine. A FALSE PASS (the engine passes a criterion a case expects to fail) fails the build; a
      # false fail and a coverage gap are warning annotations, as the Calibration Bands are. A stale
      # evaluation/results.md also fails. It takes a few seconds.
      - name: Evaluation harness (a false pass fails the build)
        run: python evaluation/run.py --check

  # The drawing crate against the Python implementation of the same standard (spec 0003): the views
  # of every fixture Design give equal normalised content in both. The Python tool is installed at
  # the commit that crates/ovcd-draw/standard/PIN.json pins, so a suite update moves both together.
  drawing-crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build ovcd
        run: cargo build -p ovcd-cli
      - name: Install the Python implementation of the standard at the pinned commit
        run: |
          pin=$(python -c "import json; p = json.load(open('crates/ovcd-draw/standard/PIN.json')); print(p['repository'] + '@' + p['commit'])")
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/${pin}"
      - name: Rust and Python give equal normalised content for every fixture view
        run: python tools/draw_crosscheck.py
      # The DXF files are read by readers that are not the crate: the standard's own test reader (group
      # codes, no ezdxf) and ezdxf with its audit. The reader lives in the standard's repository.
      - name: Read the DXF files back with the standard's reader and ezdxf
        run: |
          read -r repo commit < <(python -c "import json; p = json.load(open('crates/ovcd-draw/standard/PIN.json')); print(p['repository'], p['commit'])")
          git init -q "$RUNNER_TEMP/tdfa"
          git -C "$RUNNER_TEMP/tdfa" fetch -q --depth 1 "https://github.com/${repo}" "${commit}"
          git -C "$RUNNER_TEMP/tdfa" checkout -q FETCH_HEAD
          python tools/dxf_crosscheck.py --tdfa-src "$RUNNER_TEMP/tdfa"

  release-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Embargoed terms and local paths (tree)
        run: python tools/release_guard.py
      - name: Embargoed terms and local paths (history)
        run: python tools/release_guard.py --history
      - name: Secrets (gitleaks)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose

  # The desktop app (spec 0002). Kept out of the fast gate: it needs Node and the Tauri system
  # libraries, and the workspace's default members must build without them.
  app-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Front end (type check and build)
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: App crate (clippy, tests)
        run: |
          cargo clippy -p ovcd-app --all-targets -- -D warnings
          cargo test -p ovcd-app

  # The Windows build only has to compile: there is no installer yet.
  app-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Front end (type check and build)
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Compile the app crate
        run: cargo build -p ovcd-app

  # End-to-end smoke tests (spec 0002): the built debug app, driven by Tauri's WebDriver on Linux.
  # Its own job, so the fast gate keeps its time budget.
  app-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system libraries, WebDriver and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev webkit2gtk-driver xvfb
      - name: tauri-driver (cached)
        id: driver
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/tauri-driver
          key: tauri-driver-2.1.0-${{ runner.os }}
      - name: Install tauri-driver
        if: steps.driver.outputs.cache-hit != 'true'
        run: cargo install tauri-driver --version 2.1.0 --locked
      - name: Build the debug app
        working-directory: app
        run: |
          npm ci
          npx tauri build --debug --no-bundle
      - name: Smoke tests
        working-directory: app
        run: xvfb-run -a bash e2e/run.sh
