name: Publish to PyPI

# Publishes open-vessel-designer to PyPI when a `v*` tag is pushed (issue #1).
# Trusted publishing only: PyPI trusts this workflow file and the `pypi` environment, so there is NO token
# or secret. The `pypi` environment needs the maintainer to approve, and allows `v*` tags only.
#
# Order: `gate` (the whole release gate, release.yml) -> `sdist` -> `publish`. The wheels come from the
# release gate (`wheel-<os>` artifacts of the same run), so the files on PyPI are the files the gate tested.
# A tag that a workflow made with GITHUB_TOKEN does not start this workflow: push the tag by hand.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  gate:
    uses: ./.github/workflows/release.yml

  sdist:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Build the source distribution
        run: |
          python -m pip install "maturin>=1.7,<2"
          maturin sdist --out dist
          ls dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [gate, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write # trusted publishing: PyPI exchanges this OIDC token for a short-lived upload token
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{wheel-*,sdist}"
          path: dist
          merge-multiple: true
      - run: ls dist
      - name: Upload to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
