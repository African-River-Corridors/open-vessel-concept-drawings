[package]
name = "ovd-app"
description = "The OVD desktop app: a thin Tauri shell over the Design session in ovd-format."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Set by `tauri build`: the app serves its built front end instead of the dev server.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
ovd-shell.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
