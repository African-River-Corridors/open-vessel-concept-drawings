<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OVD</title>
    <link rel="stylesheet" href="/src/splash.css" />
  </head>
  <body>
    <div id="app"></div>
    <div id="splash" role="dialog" aria-label="OVD is starting" data-i18n-aria="app-splash-starting">
      <div class="frame">
        <div class="bp">
          <div class="brand">
            <img src="/src/assets/ovd-lockup-reversed-clear.svg" alt="OVD, Open Vessel Designer" />
            <p class="tagline" data-i18n-tagline>An open instrument for the <em>concept and preliminary design</em> of inland and coastal vessels.</p>
          </div>
          <div class="drawing" aria-hidden="true"><img src="/src/assets/splash-midship-section.svg" alt="" /></div>
          <div class="tb">
            <div><span class="k" data-i18n="app-notice-version">Version</span><span class="v" id="splash-version"></span></div>
            <div aria-live="polite"><span class="k" data-i18n="app-splash-state">State</span><span class="v" data-i18n="app-splash-starting-engine">Starting the engine</span></div>
            <div class="notice">
              <span class="k" data-i18n="app-notice-title">Before you start</span>
              <span class="v"><b data-i18n="app-notice-tool">OVD is a concept design tool.</b> <span data-i18n="app-splash-notice">Its results are not verified. Known engineering findings are under review. There is no warranty.</span></span>
            </div>
            <div><span class="k" data-i18n="app-notice-licence">Licence</span><span class="v">Apache 2.0</span></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
