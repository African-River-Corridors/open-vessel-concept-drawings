[package]
name = "ovcd-draw"
description = "The Drawing Format Standard in Rust: drawing document to normalised content, then SVG, PDF and DXF."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Pure Rust, no ovcd-core or ovcd-format. The core takes strings and values in and out; it opens no
# file, reads no clock and uses no network (spec 0003). Every transcendental goes through libm so a
# result is the same on every platform.
[dependencies]
serde_json.workspace = true
sha2 = "0.11.1"
libm = "0.2"
regex-lite = "0.1"
# PDF: pdf-writer (the typst project's low-level writer), ttf-parser for the font tables, miniz_oxide for
# deflate. All pure Rust, none opens a file.
pdf-writer = "0.15"
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
miniz_oxide = "0.8"

# Second readers for the output tests: they are not the code that writes the files.
[dev-dependencies]
lopdf = { version = "0.45", default-features = false }
roxmltree = "0.21"
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
