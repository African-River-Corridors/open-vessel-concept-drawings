[package]
name = "ovcd-format"
description = "The .vdesign format, defaults, validation, and the eval dispatch for the Python package."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ovcd-core.workspace = true
# The pure-Rust `libm`, as the core uses (the standard library `asin` is banned: spec 0001).
libm = "0.2"
serde = "1"
serde_json.workspace = true
sha2 = "0.11.1"

[dev-dependencies]
# The tests check the views against the standard itself (spec 0003). The library does not use it.
ovcd-draw.workspace = true
