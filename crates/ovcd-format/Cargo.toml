[package]
name = "ovcd-format"
description = "The .vdesign format, defaults, validation, and the eval dispatch for the Python package."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The rules kernel with its Rule Set loader (ADR 0019).
arc-rules = { workspace = true, features = ["load"] }
# `serde` writes the engine's English messages (`Text`) into the results.
ovcd-core = { workspace = true, features = ["serde"] }

# The GA views take the width of a label from the standard's text-width table (clause 11.7). The tests
# also check the views against the standard itself (spec 0003).
ovcd-draw.workspace = true
# The pure-Rust `libm`, as the core uses (the standard library `asin` is banned: spec 0001).
libm = "0.2"
serde = "1"
serde_json.workspace = true
sha2 = "0.11.1"


[dev-dependencies]
# The English test formats the Text Library with the Fluent reference implementation (spec 0005).
fluent-bundle = "0.16"
