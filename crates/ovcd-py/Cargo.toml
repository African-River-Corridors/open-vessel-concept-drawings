[package]
name = "ovcd-py"
description = "Python bindings (PyO3, abi3 for Python 3.12+), built by maturin. Not a default member."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
ovcd-format.workspace = true
# abi3-py312: one wheel per platform covers Python 3.12 and later. `extension-module` is switched on
# by maturin (pyproject.toml), so `cargo build -p ovcd-py` can still link for local checks.
pyo3 = { version = "0.28", features = ["abi3-py312"] }
